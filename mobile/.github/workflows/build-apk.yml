name: Build Flutter APK
on:
push:
branches: main # Ou 'master' selon la branche par défaut de votre dépôt
jobs:
build:
runs-on: ubuntu-latest
steps:
name: 1. Cloner le dépôt
uses: actions/checkout@v4
name: 2. Configurer Java (JDK)
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
name: 3. Configurer le SDK Flutter
uses: subosito/flutter-action@v2
with:
flutter-version: '3.47.7' # Utilise la version stable récente de Flutter
channel: 'stable'
name: 4. Installer les dépendances
run: flutter pub get
name: 5. Compiler l'APK (en mode Release)
run: flutter build apk --release
name: 6. Sauvegarder l'APK généré
uses: actions/upload-artifact@v4
with:
name: app-release
path: build/app/outputs/flutter-apk/app-release.apk