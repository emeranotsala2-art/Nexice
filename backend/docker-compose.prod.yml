# Production sur un VPS : docker compose -f docker-compose.prod.yml up -d --build
# Prerequis : un domaine (enregistrement DNS A vers le serveur), ports 80/443 ouverts, fichier .env rempli.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes: [pgdata:/var/lib/postgresql/data]      # base NON exposee a l'exterieur
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"], interval: 5s, retries: 10 }
  api:
    build: .
    restart: always
    env_file: .env
    environment: { DB_HOST: db, DB_SYNC: "false", DB_MIGRATIONS_RUN: "true" }
    depends_on: { db: { condition: service_healthy } }
  caddy:                                              # HTTPS automatique (Let's Encrypt)
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", caddy_data:/data]
    depends_on: [api]
volumes: { pgdata: {}, caddy_data: {} }
