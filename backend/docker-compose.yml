services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: nexice, POSTGRES_PASSWORD: nexice, POSTGRES_DB: nexice }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexice"], interval: 5s, retries: 10 }
  api:
    build: .
    profiles: ["full"]          # docker compose --profile full up -d --build
    env_file: .env
    environment: { DB_HOST: db }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
